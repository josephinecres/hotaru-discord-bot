services:
  - type: web
    name: hotaru-discord-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTO_CHAT_CHANNEL_ID
        sync: false
      - key: AUTO_TTS_CHANNEL_ID
        sync: false